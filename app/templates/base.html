<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>{% block title %}Stylist.ai{% endblock %}</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Forum&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-nude: #DCC7C1;
      --bg-dark: #4C2F27;
      --text-main: #4C2F27;
    }
    body {
      background-color: #DBC7C0; /* Немного обновил базовый фон под гардероб */
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--text-main);
    }
    .font-forum { font-family: 'Forum', serif; }

    .btn-dark {
      background-color: var(--bg-dark);
      color: white;
      border-radius: 9999px;
      transition: all 0.3s;
    }
    .btn-dark:hover { opacity: 0.9; transform: translateY(-1px); }

        /* Улучшаем читаемость материала */
    .material-tag {
        font-family: 'Forum', serif; /* Или Sans, если хочешь более современный вид */
        font-weight: 600;
        letter-spacing: 0.05em;
    }

    /* Выделение блока категорий */
    .category-container {
        background: rgba(76, 47, 39, 0.03); /* Едва заметный оттенок основного цвета */
        border-radius: 1.5rem;
        padding: 1rem;
        border: 1px solid rgba(76, 47, 39, 0.05);
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body class="antialiased">

  <header class="bg-[#E3D4D0] py-5 px-16 flex items-center justify-between shadow-[0_2px_15px_rgba(0,0,0,0.03)] sticky top-0 z-[100]">
  <a href="/" class="text-[36px] font-forum tracking-tight text-[#4C2F27] ml-8">
    Stylist.ai
  </a>

  <nav class="hidden md:flex items-center gap-14 text-[15px] uppercase tracking-[0.15em] text-[#4C2F27] opacity-80 ml-auto mr-12">
    <a href="/wardrobe" class="hover:opacity-100 transition-opacity">Гардероб</a>
    <a href="/capsules" class="hover:opacity-100 transition-opacity">Капсулы</a>
    <a href="#" class="hover:opacity-100 transition-opacity">О стиле</a>
  </nav>

  <div class="flex items-center gap-10">
    {% if current_user %}
      <div class="flex items-center gap-6">
        <div class="hidden sm:flex flex-col items-end leading-none">
          <span class="text-[12px] uppercase tracking-widest text-[#4C2F27] opacity-40 font-bold">Аккаунт</span>
          <span class="text-[16px] font-bold text-[#4C2F27] font-forum">{{ current_user.email.split('@')[0] }}</span>
        </div>

        <form method="post" action="/logout" class="inline m-0">
           <button type="submit" class="px-6 py-2 rounded-full bg-[#4C2F27] text-[#DCC7C1] text-[13px] uppercase tracking-widest hover:brightness-110 transition-all shadow-lg shadow-black/5">
             Выйти
           </button>
        </form>
      </div>
    {% else %}
      <a href="/login" class="text-[15px] border-b border-[#4C2F27]/30 text-[#4C2F27] hover:border-[#4C2F27] transition-colors">Войти</a>
      <a href="/register" class="bg-[#4C2F27] text-[#DCC7C1] px-8 py-2.5 rounded-full text-[14px] uppercase tracking-widest hover:brightness-110 transition-all">
        Начать
      </a>
    {% endif %}
  </div>
</header>

  <main>
    {% block content %}{% endblock %}
  </main>

</body>
</html>
