{% extends "base.html" %}
{% block title %}Редактирование — {{ item.name or 'Вещь' }}{% endblock %}

{% block content %}
<div class="min-h-screen pt-12 pb-24">
  <div class="max-w-7xl mx-auto px-10">

    <a href="/wardrobe" class="inline-flex items-center text-[14px] uppercase tracking-[0.2em] opacity-60 hover:opacity-100 mb-12 transition-all group">
      <svg class="w-5 h-5 mr-3 transition-transform group-hover:-translate-x-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path d="M15 19l-7-7 7-7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Назад в гардероб
    </a>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-16 items-start">

      <div class="bg-white rounded-[3.5rem] p-8 shadow-sm">
        <div class="relative w-full aspect-[3/4] bg-[#F9F7F6] rounded-[2.8rem] overflow-hidden flex items-center justify-center p-12">
          <img src="/static/uploads/{{ item.file_id }}"
               class="max-h-full max-w-full object-contain drop-shadow-2xl"
               alt="Preview">
        </div>
      </div>

      <div class="relative bg-white rounded-[3.5rem] overflow-hidden shadow-xl min-h-[600px]">

        <img src="/static/img/features_bg.jpg"
             class="absolute inset-0 w-full h-full object-cover opacity-[0.07] blur-[1px]"
             alt="">

        <div class="relative z-10 p-12 lg:p-16">
          <h2 class="text-[48px] font-forum tracking-tight mb-14 leading-none">Параметры вещи</h2>

          <form action="/wardrobe/item/{{ item.id }}/edit" method="post" class="space-y-12">

            <div class="border-b border-[#4C2F27]/10 pb-4 focus-within:border-[#4C2F27] transition-all">
              <label class="block text-[11px] uppercase tracking-[0.4em] opacity-40 mb-3 ml-1">Название</label>
              <input type="text" name="name" value="{{ item.name or '' }}"
                     placeholder="Напр: Кашемировое пальто"
                     class="w-full bg-transparent outline-none text-[24px] font-forum placeholder:opacity-20 text-[#4C2F27]"/>
            </div>

            <div class="grid grid-cols-2 gap-12">
              <div class="border-b border-[#4C2F27]/10 pb-4 focus-within:border-[#4C2F27] transition-all">
                <label class="block text-[11px] uppercase tracking-[0.4em] opacity-40 mb-3 ml-1">Категория</label>
                <input type="text" name="manual_category_ru" value="{{ item.manual_category_ru or item.category_ru }}"
                       class="w-full bg-transparent outline-none text-[20px] font-forum"/>
              </div>
              <div class="border-b border-[#4C2F27]/10 pb-4 focus-within:border-[#4C2F27] transition-all opacity-40">
                <label class="block text-[11px] uppercase tracking-[0.4em] opacity-40 mb-3 ml-1">Category (EN)</label>
                <input type="text" name="manual_category_en" value="{{ item.category_en }}"
                       class="w-full bg-transparent outline-none text-[20px] font-forum" readonly/>
              </div>
            </div>

            <div class="grid grid-cols-2 gap-12">
              <div class="border-b border-[#4C2F27]/10 pb-4 focus-within:border-[#4C2F27] transition-all">
                <label class="block text-[11px] uppercase tracking-[0.4em] opacity-40 mb-3 ml-1">Цвет</label>
                <div class="flex items-center gap-4">
                  <div class="w-6 h-6 rounded-full border border-white shadow-sm" style="background-color: {{ item.color_en }}"></div>
                  <input type="text" name="manual_color" value="{{ item.manual_color or item.color_ru }}"
                         class="w-full bg-transparent outline-none text-[20px] font-forum"/>
                </div>
              </div>
              <div class="border-b border-[#4C2F27]/10 pb-4 focus-within:border-[#4C2F27] transition-all">
                <label class="block text-[11px] uppercase tracking-[0.4em] opacity-40 mb-3 ml-1">Материал</label>
                <input type="text" name="manual_material" value="{{ item.manual_material or '' }}"
                       placeholder="Шерсть, шелк..."
                       class="w-full bg-transparent outline-none text-[20px] font-forum"/>
              </div>
            </div>

            <div class="pt-10 flex gap-6">
              <button type="submit"
                      class="flex-[2] bg-[#4C2F27] text-[#DCC7C1] py-6 rounded-full text-[14px] uppercase tracking-[0.2em] font-bold shadow-lg hover:brightness-125 transition-all">
                Сохранить изменения
              </button>
              <a href="/wardrobe"
                 class="flex-1 text-center py-6 rounded-full border border-[#4C2F27]/10 text-[14px] uppercase tracking-[0.2em] opacity-60 hover:opacity-100 transition-all">
                Отмена
              </a>
            </div>
          </form>

          <div class="mt-20 pt-10 border-t border-[#4C2F27]/5 text-center">
            <form action="/wardrobe/item/{{ item.id }}/delete" method="post" onsubmit="return confirm('Удалить навсегда?')">
              <button type="submit" class="text-[11px] uppercase tracking-[0.4em] text-rose-800/40 hover:text-rose-800 transition-colors font-bold">
                Удалить из гардероба
              </button>
            </form>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
